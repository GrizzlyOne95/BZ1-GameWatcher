services:
  - type: web
    name: bz1-gamewatcher
    runtime: docker
    plan: free
    region: ohio
    dockerfilePath: ./Dockerfile.render
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Steam__ApiKey
        sync: false
