<div [ngClass]="['watcher-status', statusClass]"
     [attr.title]="tooltip"
     [attr.aria-label]="tooltip"
     role="status"
     aria-live="polite">
    <span class="status-dot" aria-hidden="true"></span>
    <span class="status-copy">
        <strong>{{ statusLabel }}</strong>
        <small>{{ detailLabel }}</small>
    </span>
</div>
