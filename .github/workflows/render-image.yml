name: Render image

on:
  pull_request:
    paths:
      - "API/**"
      - "Web/**"
      - "Dockerfile.render"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/render-image.yml"
  push:
    branches:
      - main
    paths:
      - "API/**"
      - "Web/**"
      - "Dockerfile.render"
      - ".dockerignore"
      - "render.yaml"
      - ".github/workflows/render-image.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Render production image
        run: docker build --file Dockerfile.render --tag bz1-gamewatcher:render .

      - name: Start production image
        run: |
          docker run --detach \
            --name bz1-gamewatcher-render-test \
            --publish 10000:10000 \
            --env PORT=10000 \
            bz1-gamewatcher:render

      - name: Wait for API health check
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:10000/api/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs bz1-gamewatcher-render-test
          exit 1

      - name: Verify Angular shell
        run: |
          curl --fail --silent --show-error http://127.0.0.1:10000/ \
            | grep --quiet '<app-root'

      - name: Print container logs on failure
        if: failure()
        run: docker logs bz1-gamewatcher-render-test || true
