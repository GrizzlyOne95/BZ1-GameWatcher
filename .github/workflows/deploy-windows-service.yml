name: Deploy Windows service

on:
  workflow_run:
    workflows: [ "Build, test and publish" ]
    types: [ completed ]

permissions:
  contents: read
  actions: read

concurrency:
  group: bz1-gamewatcher-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production Windows service
    # workflow_run can also fire for PR and manual runs. Production deploys are restricted to a
    # successful push to main, so unmerged code can never reach the production runner.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: [ self-hosted, Windows, X64, bz1-gamewatcher-prod ]
    timeout-minutes: 10

    steps:
      - name: Check out exact successful commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download tested Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-service-${{ github.event.workflow_run.head_sha }}
          path: deploy-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Deploy with health-check rollback
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\deploy-windows-service.ps1
          -PackagePath "${{ github.workspace }}\deploy-package"
          -ReleaseId "${{ github.event.workflow_run.head_sha }}"
