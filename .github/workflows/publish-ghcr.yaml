name: Build, test and publish

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_NAME: battlezone-api-ghcr
  WEB_NAME: battlezone-web-ghcr

jobs:
  build_api:
    name: Build and test API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore API
        run: dotnet restore API/BZAPI.csproj
      - name: Build API
        run: dotnet build API/BZAPI.csproj --configuration Release --no-restore
      - name: Restore API tests
        run: dotnet restore API.Tests/API.Tests.csproj
      - name: Test API protocol corpus
        run: dotnet test API.Tests/API.Tests.csproj --configuration Release --no-restore

  build_web:
    name: Build and test web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install dependencies
        working-directory: Web
        run: npm ci
      - name: Test
        working-directory: Web
        run: npm run test:ci
      - name: Build
        working-directory: Web
        run: npm run build

  publish:
    name: Publish images
    # Only publish from main, and only once the code is known to build and pass its tests.
    # Previously every push on every branch overwrote the production :latest tags.
    # workflow_dispatch is allowed so a publish can be triggered from the Actions tab without
    # an empty commit — needed to republish after Actions has been disabled, for instance.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [ build_api, build_web ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      # Images must live under this repository's own owner: GITHUB_TOKEN can only write
      # packages in its own namespace, and pushing to a hard-coded upstream owner 403s on
      # a fork. GHCR also rejects uppercase paths, so the owner is lowercased here.
      - name: Resolve image names
        id: images
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "api=${REGISTRY}/${owner}/${API_NAME}" >> "$GITHUB_OUTPUT"
          echo "web=${REGISTRY}/${owner}/${WEB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./API
          push: true
          # Tagging by commit SHA as well as latest makes a rollback possible.
          tags: |
            ${{ steps.images.outputs.api }}:latest
            ${{ steps.images.outputs.api }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: ./Web
          push: true
          tags: |
            ${{ steps.images.outputs.web }}:latest
            ${{ steps.images.outputs.web }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max